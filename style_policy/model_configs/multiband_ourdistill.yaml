# Our-teacher distillation (128M-big -> 256/8 student). Trains on the teacher's factored soft
# targets via KL. Paired with multiband_ourdistill_human.yaml (identical except CE-on-human target)
# to test at SATURATION (~16M): does distilling our own converged teacher give better concept
# features than one-hot human CE? (Maia-3 backbone probe showed Maia-3 isn't a richer encoder, so
# our own teacher is the right, fast teacher for this mechanism test.)
name: multiband_ourdistill
checkpoint_dir: style_policy_checkpoints/multiband_ourdistill
train_h5: /mnt/eloquence_bulk/databases/ourteacher_distill_labels.h5
val_h5: /mnt/eloquence_bulk/databases/wdl_validation_2025_05.h5   # held-out human-move val (comparable curve)
val_sample: {n: 20000, seed: 42}
distill: true
preshuffled: false
wandb:
  project: style_policy
  mode: online
architecture:
  d_model: 256
  n_layers: 8
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  head_hidden: 512
  elo_dim: 32
  n_elo_buckets: 40
  use_castling_ep: true
  use_cls_in_heads: true
  use_last_move: true
  n_history_ply: 2
  bands: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100]
defaults:
  batch_size: 256
  dataloader_num_workers: 4
  use_amp: true
  amp_dtype: bf16
  weight_decay: 0.01
  max_gradient_norm: 1.0
  log_interval: 50
  val_interval: 5000                 # held-out human_ce + human_match every 5k steps (~25 points)
  snapshot_steps: [15625, 31250, 62500, 93750, 125000]  # 4M,8M,16M,24M,32M samples -> post-hoc concept curves
  checkpoint_interval: 5000
  lr_schedule: cosine
  warmup_steps: 2000
  lr_min_frac: 0.0
  seed: 0
  value_loss_weight: 1.0
  last_move_dropout: 0.15
  history_dropout: binary
stages:
  - sample: {n: 32000000, seed: 1}
    train: {epochs: 1, learning_rate: 0.0002}
    label_smoothing: 0.1
