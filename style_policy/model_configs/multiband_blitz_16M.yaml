# BLITZ 16M training run: the fast 8L/256d shape (= Maia-3-5M's shape), trained on blitz (180+0,
# 2024-01, <30s-clock positions dropped) so we can compare to Maia-3 on the Allie blitz benchmark
# at equal footing. Same recipe/flags as the small rapid production config, just the blitz train_h5.
# val_h5 is the rapid 2025-05 set used ONLY as a cross-TC convergence monitor (loss is offset by the
# TC mismatch; the DECISIVE metric is scripts/eval_allie.py after training).
name: multiband_blitz_16M
checkpoint_dir: style_policy_checkpoints/multiband_blitz_16M
train_h5: /mnt/eloquence_bulk/databases/wdl_blitz_16M.h5
val_h5: /mnt/eloquence_bulk/databases/wdl_validation_2025_05.h5   # cross-TC monitor only
val_sample: {n: 10000, seed: 42}
preshuffled: true
wandb:
  project: style_policy
  mode: online
architecture:
  d_model: 256
  n_layers: 8
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  head_hidden: 512
  elo_dim: 32
  n_elo_buckets: 40
  use_castling_ep: true
  use_cls_in_heads: true
  use_last_move: true
  n_history_ply: 2
  bands: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100]
defaults:
  batch_size: 256
  dataloader_num_workers: 4
  use_amp: true
  amp_dtype: bf16
  weight_decay: 0.01
  max_gradient_norm: 1.0
  log_interval: 50
  val_interval: 2000
  checkpoint_interval: 2000
  lr_schedule: cosine
  warmup_steps: 2000
  lr_min_frac: 0.0
  seed: 0
  value_loss_weight: 1.0
  last_move_dropout: 0.15
  history_dropout: binary
stages:
  - sample: {n: 16032000, seed: 1}
    train: {epochs: 1, learning_rate: 0.0002}
    label_smoothing: 0.1
