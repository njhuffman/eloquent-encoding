# GENERIC-ENCODER TEST: freeze the best RAPID encoder (multiband_history_128M_big, 384/12, 33M,
# trained on 128M rapid, val CE 1.456 / 53.3% rapid) and train FRESH per-band BLITZ heads on it.
# If this reaches the full-blitz-model / Maia-3 level on the Allie blitz benchmark, it means the
# encoder is a generic board-understanding module and rapid-vs-blitz is just a head-level readout.
# Encoder arch MUST match the source big model exactly so init_encoder_from loads cleanly.
name: multiband_blitz_heads_on_bigrapid
checkpoint_dir: style_policy_checkpoints/multiband_blitz_heads_on_bigrapid
train_h5: /mnt/eloquence_bulk/databases/wdl_blitz_16M.h5
val_h5: /mnt/eloquence_bulk/databases/wdl_validation_2025_05.h5   # cross-TC monitor only; decisive metric = eval_allie.py
val_sample: {n: 10000, seed: 42}
preshuffled: true
init_encoder_from: style_policy_checkpoints/multiband_history_128M_big/multiband_history_128M_big.pt
freeze_encoder: true
wandb:
  project: style_policy
  mode: online
architecture:
  d_model: 384
  n_layers: 12
  nhead: 8
  dim_feedforward: 1536
  dropout: 0.0
  head_hidden: 512
  elo_dim: 32
  n_elo_buckets: 40
  use_castling_ep: true
  use_cls_in_heads: true
  use_last_move: true
  n_history_ply: 2
  bands: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100]
defaults:
  batch_size: 256
  dataloader_num_workers: 4
  use_amp: true
  amp_dtype: bf16
  weight_decay: 0.01
  max_gradient_norm: 1.0
  log_interval: 50
  val_interval: 2000
  checkpoint_interval: 2000
  lr_schedule: cosine
  warmup_steps: 2000
  lr_min_frac: 0.0
  seed: 0
  value_loss_weight: 1.0
  last_move_dropout: 0.15
  history_dropout: binary
stages:
  - sample: {n: 16032000, seed: 1}
    train: {epochs: 1, learning_rate: 0.0002}
    label_smoothing: 0.1
