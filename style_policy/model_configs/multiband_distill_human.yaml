# DISTILLATION experiment (HUMAN baseline). Identical to multiband_distill_maia3.yaml in every
# respect EXCEPT the training target: standard one-hot human-move CE (with label smoothing 0.1)
# instead of Maia-3 soft targets. Same architecture, same positions (the same label h5), same
# recipe -> the ONLY variable is human-one-hot vs Maia-3-soft. Baseline for the world-model probes.
name: multiband_distill_human
checkpoint_dir: style_policy_checkpoints/multiband_distill_human
train_h5: /mnt/eloquence_bulk/databases/maia3_distill_labels.h5
distill: false           # <-- one-hot human-move CE (standard training)
preshuffled: false
architecture:
  d_model: 256
  n_layers: 8
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  head_hidden: 512
  elo_dim: 32
  n_elo_buckets: 40
  use_castling_ep: true
  use_cls_in_heads: true
  use_last_move: true
  n_history_ply: 2
  bands: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900]  # within Maia-3's range
defaults:
  batch_size: 256
  dataloader_num_workers: 4
  use_amp: true
  amp_dtype: bf16
  weight_decay: 0.01
  max_gradient_norm: 1.0
  log_interval: 50
  val_interval: 0
  checkpoint_interval: 5000
  lr_schedule: cosine
  warmup_steps: 2000
  lr_min_frac: 0.0
  seed: 0
  value_loss_weight: 1.0
  last_move_dropout: 0.15
  history_dropout: binary
stages:
  - sample: {n: 20000000, seed: 1}
    train: {epochs: 3, learning_rate: 0.0002}
    label_smoothing: 0.1
