# BIG + GAB run: param-matched A/B against multiband_history_128M_big (33.37M, no-GAB, 53.3%).
# Identical recipe/data/flags and identical encoder SHAPE (d384/L12/nhead8) so GAB is the ONLY
# real change. GAB adds a ~fixed +2.17M (gab_proj3), so dim_feedforward is trimmed 1536->1312 to
# land at 33.47M (+0.3% vs the no-GAB big) -> a clean equal-budget comparison, not a bigger model.
# NOTE: GAB forces the slow attention path in eval (see board_encoder fast-path fix); seq is only
# 65 tokens so attention memory is tiny -> batch 256 still expected to fit. Resumable via --resume.
name: multiband_history_128M_big_gab
checkpoint_dir: style_policy_checkpoints/multiband_history_128M_big_gab
train_h5: /mnt/eloquence_bulk/databases/wdl_history_128M.h5
val_h5: /mnt/eloquence_bulk/databases/wdl_validation_2025_05.h5
val_sample: {n: 10000, seed: 42}
preshuffled: true
wandb:
  project: style_policy
  mode: online
architecture:
  d_model: 384
  n_layers: 12
  nhead: 8
  dim_feedforward: 1312
  dropout: 0.0
  head_hidden: 512
  elo_dim: 32
  n_elo_buckets: 40
  use_castling_ep: true
  use_cls_in_heads: true
  use_last_move: true
  n_history_ply: 2
  use_gab: true
  gab_d1: 8
  gab_d2: 64
  bands: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100]
defaults:
  batch_size: 256
  dataloader_num_workers: 4
  use_amp: true
  amp_dtype: bf16
  weight_decay: 0.01
  max_gradient_norm: 1.0
  log_interval: 50
  val_interval: 2000
  checkpoint_interval: 2000
  lr_schedule: cosine
  warmup_steps: 2000
  lr_min_frac: 0.0
  seed: 0
  value_loss_weight: 1.0
  last_move_dropout: 0.15
  history_dropout: binary
  snapshot_steps: [62500, 125000, 250000]
stages:
  - sample: {n: 123680000, seed: 1}
    train: {epochs: 1, learning_rate: 0.0002}
    label_smoothing: 0.1
