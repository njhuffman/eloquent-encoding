# DISTILLATION experiment (Maia-3 target). Trains the 8L/256d shared-encoder multiband policy on
# Maia-3's factored soft targets (maia_from = P(from), maia_to = P(to|true-from)) via KL, instead
# of one-hot human moves. Paired with multiband_distill_human.yaml (identical arch/data/recipe;
# only the target differs) to test: does distilling a model yield a better/worse WORLD MODEL
# (strength r, naturalness AUC) than training on real humans, at matched move accuracy?
name: multiband_distill_maia3
checkpoint_dir: style_policy_checkpoints/multiband_distill_maia3
train_h5: /mnt/eloquence_bulk/databases/maia3_distill_labels.h5
distill: true            # <-- factored KL to maia_from / maia_to
preshuffled: false
architecture:
  d_model: 256
  n_layers: 8
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  head_hidden: 512
  elo_dim: 32
  n_elo_buckets: 40
  use_castling_ep: true
  use_cls_in_heads: true
  use_last_move: true
  n_history_ply: 2
  bands: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100]
defaults:
  batch_size: 256
  dataloader_num_workers: 4
  use_amp: true
  amp_dtype: bf16
  weight_decay: 0.01
  max_gradient_norm: 1.0
  log_interval: 50
  val_interval: 0
  checkpoint_interval: 5000
  lr_schedule: cosine
  warmup_steps: 2000
  lr_min_frac: 0.0
  seed: 0
  value_loss_weight: 1.0
  last_move_dropout: 0.15
  history_dropout: binary
stages:
  - sample: {n: 20000000, seed: 1}
    train: {epochs: 3, learning_rate: 0.0002}
    label_smoothing: 0.1
